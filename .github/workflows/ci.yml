name: CI
on:
  push:
    branches: [master, "agent/**"]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet restore ERP.AI.sln
      - run: dotnet build ERP.AI.sln --configuration Release --no-restore
      - run: dotnet test ERP.AI.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
